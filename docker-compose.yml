version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    environment:
      - VITE_API_BASE_URL=http://api:8000

  api:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      - DATABASE_URL=postgresql://slideforge:slideforge@postgres:5432/slideforge
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=slideforge
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE_HOURS=24

  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker -l info
    depends_on:
      - api
      - redis
      - postgres
    environment:
      - DATABASE_URL=postgresql://slideforge:slideforge@postgres:5432/slideforge
      - REDIS_URL=redis://redis:6379/0
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - PEXELS_API_KEY=${PEXELS_API_KEY}

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=slideforge
      - POSTGRES_PASSWORD=slideforge
      - POSTGRES_DB=slideforge
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - api
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

volumes:
  postgres_data:
  minio_data:
